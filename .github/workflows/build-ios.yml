name: Build Minis iOS (WorkBuddy)

on:
  workflow_dispatch:
  push:
    branches: [workbuddy-provider]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(xcode-select -p); fi
          echo "Using $XC"
          echo "DEVELOPER_DIR=$XC" >> $GITHUB_ENV
          echo "XCODE_PATH=$XC" >> $GITHUB_ENV
          sudo xcode-select -s "$XC"

      - name: Install toolchain
        run: |
          set -e
          brew install ninja llvm libarchive pkg-config go meson lld
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Prepare build-time customization
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      # The native dependency chain (lame → ffmpeg → iSH → rootfs → rclone)
      # takes 30-60 minutes and its inputs are the pinned sources, so it only
      # needs rebuilding when those change. Each dependency gets its own cache
      # entry keyed on exactly the thing that invalidates it, so a change to
      # one does not throw away the others. Paths are the scripts' own outputs.
      - name: Cache lame
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/lame-3.100
          key: dep-lame-${{ runner.os }}-${{ hashFiles('deps/build_lame.sh') }}

      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            deps/ffmpeg-6.1.2
            deps/ffmpeg-patch
          key: dep-ffmpeg-${{ runner.os }}-${{ hashFiles('deps/build_ffmpeg.sh', 'deps/ffmpeg-patch/**') }}

      - name: Cache iSH + rootfs
        uses: actions/cache@v4
        with:
          path: |
            deps/ish/libs
            deps/ish/include
            deps/ish/resources
            deps/ish/build-native
            deps/resources
          key: dep-ish-${{ runner.os }}-${{ hashFiles('deps/build_ish.sh', 'deps/prepare_alpine_rootfs.sh', '.gitmodules') }}

      - name: Cache rclone
        uses: actions/cache@v4
        with:
          path: |
            deps/build
            deps/frameworks
          key: dep-rclone-${{ runner.os }}-${{ hashFiles('deps/build_rclone_ios.sh', 'deps/rclone-mobile/go.sum') }}

      - name: Build native deps (lame → ffmpeg → ish → rootfs → rclone)
        run: |
          set -e
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix go)/libexec/bin:$(brew --prefix)/bin:$PATH"
          go version
          # The deps scripts are NOT incremental: lame runs `make distclean`
          # and ffmpeg reconfigures every time. So a restored cache is only
          # worth anything if each finished step is skipped explicitly here.
          # The sentinel is the artifact the next step actually consumes.
          if [ -f deps/lame-build/lib/libmp3lame.a ]; then
            echo "::notice::lame cached — skipping"
          else
            ./deps/build_lame.sh
          fi

          if [ -d deps/ffmpeg-6.1.2/build-ios/install/include ]; then
            echo "::notice::ffmpeg cached — skipping"
          else
            ./deps/build_ffmpeg.sh
          fi

          if [ -d deps/ish/resources ] && [ -n "$(ls -A deps/ish/resources 2>/dev/null)" ]; then
            echo "::notice::iSH cached — skipping"
          else
            ./deps/build_ish.sh
          fi

          if [ -d deps/resources/alpine-rootfs/data ] && [ -f deps/resources/alpine-rootfs/meta.db ]; then
            echo "::notice::alpine rootfs cached — skipping"
          else
            ./deps/prepare_alpine_rootfs.sh
          fi

          if [ -d deps/frameworks/Rclone.xcframework ]; then
            echo "::notice::rclone cached — skipping"
          else
            cd deps/rclone-mobile && go get github.com/go-json-experiment/json@latest && go mod tidy && cd ../..
            ./deps/build_rclone_ios.sh
          fi

      - name: Build app (unsigned, device)
        run: |
          set -eo pipefail
          mkdir -p build
          # Stamp the build number with the run date so two IPAs can be told
          # apart on-device (Settings → About). Previously every build shipped
          # as 1.0(2), which made "did you install the new one?" unanswerable —
          # a stale-cache LiveContainer install and a fresh build looked alike.
          # Minute precision: `%y%m%d%H` gave two builds in the same hour the
          # same number, so back-to-back fixes were indistinguishable.
          BUILD_NUM=$(date -u +%y%m%d%H%M)
          echo "build number: $BUILD_NUM"
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$BUILD_NUM \
            -derivedDataPath build/DerivedData build > build/xcodebuild.log 2>&1 \
            || { sh scripts/ci-diagnostic-errors.sh build/xcodebuild.log; exit 1; }
          tail -3 build/xcodebuild.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log

      - name: Diagnose products
        run: |
          set -e
          ls -la build/DerivedData/Build/Products/Release-iphoneos/
          echo "--- Minis.app root ---"
          ls -la build/DerivedData/Build/Products/Release-iphoneos/Minis.app/ | head -40
          echo "--- embedded binaries ---"
          find build/DerivedData/Build/Products/Release-iphoneos -name "*.appex" -o -name "*.framework" | head -20

      # Build, sign, then package. An app published with no LC_CODE_SIGNATURE
      # on the main binary while its frameworks still carry stale signatures
      # from a previous signing pass is killed by amfid before main() runs —
      # that is the launch crash this step exists to prevent. Ad-hoc signing
      # ("-") is enough: sideloading tools re-sign the whole bundle anyway, and
      # nested code must be self-consistent first.
      - name: Clean stale signatures and ad-hoc sign
        run: |
          set -eo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"

          # 1. Drop every stale signature so nothing half-signed is left behind.
          find "$APP" -type d -name "_CodeSignature" -prune -exec rm -rf {} + 2>/dev/null || true
          find "$APP" -name "CodeResources" -delete 2>/dev/null || true

          # 2. Sign inside-out: deepest nested code first, the app bundle last.
          #    Frameworks and dylibs.
          find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) 2>/dev/null | while read -r item; do
            echo "  sign framework: $item"
            codesign --force --timestamp=none --sign - "$item"
          done
          #    Any other loose dylibs in the bundle root.
          find "$APP" -maxdepth 1 -name "*.dylib" 2>/dev/null | while read -r item; do
            echo "  sign dylib: $item"
            codesign --force --timestamp=none --sign - "$item"
          done
          #    App extensions, then the host app.
          find "$APP/PlugIns" -maxdepth 1 -name "*.appex" 2>/dev/null | while read -r item; do
            echo "  sign appex: $item"
            codesign --force --timestamp=none --sign - \
              --preserve-metadata=identifier,entitlements,requirements,flags "$item"
          done
          echo "  sign app: $APP"
          codesign --force --timestamp=none --sign - "$APP"

          # 3. Verify the result actually carries a signature.
          echo "--- verification ---"
          codesign --verify --deep --strict --verbose=2 "$APP" || {
            echo "::error::Ad-hoc signature verification failed"; exit 1; }
          codesign -dvv "$APP" 2>&1 | head -20

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          rm -rf build/Payload build/Minis-workbuddy-unsigned.ipa
          mkdir -p build/Payload
          # ditto preserves symlinks, resource forks and xattrs that `cp -R`
          # can silently flatten inside frameworks.
          /usr/bin/ditto "$APP" build/Payload/Minis.app
          cd build
          zip -qry Minis-workbuddy-unsigned.ipa Payload
          cd ..
          ls -l build/Minis-workbuddy-unsigned.ipa

      - name: Verify packaged IPA
        run: |
          set -eo pipefail
          cd build && rm -rf /tmp/ipa-check && mkdir -p /tmp/ipa-check
          unzip -q Minis-workbuddy-unsigned.ipa -d /tmp/ipa-check
          test -f /tmp/ipa-check/Payload/Minis.app/Minis
          codesign --verify --deep --strict --verbose=2 /tmp/ipa-check/Payload/Minis.app
          ls -la /tmp/ipa-check/Payload/Minis.app/ | head -20
          echo "IPA verified."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minis-workbuddy-ipa
          path: build/Minis-workbuddy-unsigned.ipa

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=vworkbuddy-minis
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Minis iOS (unsigned) — WorkBuddy provider" \
            --notes "Minis iOS build with the WorkBuddy (CodeBuddy) provider: scan-code sign-in for both China (copilot.tencent.com) and international (workbuddy.ai) sites, automatic model discovery, streaming chat. Ad-hoc signed IPA — sideload with a tool of your choice (e.g. Sideloadly / AltStore / TrollStore)." \
            build/Minis-workbuddy-unsigned.ipa
