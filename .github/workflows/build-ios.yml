name: Build Minis iOS (WorkBuddy)

on:
  workflow_dispatch:
  push:
    branches: [workbuddy-provider]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(xcode-select -p); fi
          echo "Using $XC"
          echo "DEVELOPER_DIR=$XC" >> $GITHUB_ENV
          sudo xcode-select -s "$XC"

      - name: Install toolchain
        run: |
          set -e
          brew install ninja llvm libarchive pkg-config go meson lld
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Prepare build-time customization
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Build native deps (lame → ffmpeg → ish → rootfs → rclone)
        run: |
          set -e
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Build app (unsigned, device)
        run: |
          set -e
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/DerivedData build | tail -40

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qr Minis-workbuddy-unsigned.ipa Payload
          cd ..
          ls -l build/Minis-workbuddy-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minis-workbuddy-ipa
          path: build/Minis-workbuddy-unsigned.ipa

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=vworkbuddy-minis
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi
          gh release create "$TAG" \
            --title "Minis iOS (unsigned) — WorkBuddy provider" \
            --notes "Minis iOS build with the WorkBuddy (CodeBuddy) provider: scan-code sign-in for both China (copilot.tencent.com) and international (workbuddy.ai) sites, automatic model discovery, streaming chat. Unsigned IPA - sideload with a tool of your choice (e.g. Sideloadly / AltStore / TrollStore)." \
            build/Minis-workbuddy-unsigned.ipa
