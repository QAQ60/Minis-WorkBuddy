name: Inspect IPA

on:
  push:
    branches: [workbuddy-provider]
    paths: ['.github/workflows/inspect-ipa.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    steps:
      - name: Download and inspect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release download vworkbuddy-minis -R "$GITHUB_REPOSITORY" -p "*.ipa" -D ipa
          cd ipa
          python3 - <<'EOF'
          import zipfile
          z = zipfile.ZipFile('Minis-workbuddy-unsigned.ipa')
          names = z.namelist()
          print("TOTAL ENTRIES:", len(names))
          for n in sorted(names):
              if n.count('/') <= 2:
                  info = z.getinfo(n)
                  print(f"  {n}  {info.file_size}")
          EOF
